[package]
name = "cellpresence"
version = "0.1.0"
edition = "2024"
description = "Tray app that exposes your PS3 as Discord Rich Presence"
license = "Apache-2.0"

[[bin]]
name = "cellpresence"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = true
lto = true

[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

